<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Letter 💌</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <div class="envelope">💌</div>

    <h1>A Little Letter For tashini</h1>

    <p class="subtitle">I made something small for you...</p>

    <button onclick="openLetter()">Open the Letter 💗</button>

    <div id="letter" class="letter">
      <h2>Dear You 🌸</h2>

      <p>
        I just wanted to say something simple...
      </p>

      <p>
        You are someone who makes ordinary moments
        feel a little more special. 😊
      </p>

      <p>
        I hope this little message makes you smile.
      </p>

      <p class="end">
        — From someone who thinks you're special 💫
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
